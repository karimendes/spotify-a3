<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Faça login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="./src/assets/icons/favicon.ico"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      font-family: "DM Sans", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background-color: #181818;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
      width: 400px;
      text-align: center;
    }

    .logo {
      margin-bottom: 20px;
    }

    .logo img {
      width: 120px;
    }

    h1 {
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      background-color: #242424;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #1DB954;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #1ed760;
    }

    .register-text {
      color: white;
      margin-top: 16px;
    }

    .register-text a {
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }

    .register-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="./src/assets/icons/logo-spotify.png" alt="Logo">
    </div>
    <h1>Faça login</h1>
    <form action="#" method="POST" onsubmit="return loginUser(event)">
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit" class="btn">Entrar</button>
    </form>

    <p class="register-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      const user = JSON.parse(localStorage.getItem(email));

      if (!user || user.senha !== senha) {
        alert("Usuário ou senha inválidos.");
        return;
      }

      window.location.href = "index.html";
    }
  </script>
</body>
</html>
