<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Faça login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="./src/assets/icons/favicon.ico"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/cadastro-login.css">
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./src/assets/icons/logo-spotify.png" alt="Logo">
    </div>
    <h1>Faça login</h1>
    <form action="#" method="POST" onsubmit="return loginUser(event)">
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit" class="btn">Entrar</button>
    </form>

    <p class="register-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

<script src="script.js" type="text/javascript"></script>

</body>
</html>
