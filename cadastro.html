<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastre-se e comece a curtir</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="./src/assets/icons/favicon.ico"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/cadastro-login.css">  
</head>

<body>
  <div class="container">
    <div class="logo">
      <img src="./src/assets/icons/logo-spotify.png" alt="Logo">
    </div>
    <h1>Cadastre-se e comece a curtir</h1>
    <form action="#" method="POST" onsubmit="return registerUser(event)">
      <input type="text" id="nome" placeholder="Nome completo" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Crie uma senha" required>
      <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p class="login-text">Já tem uma conta? <a href="login.html">Faça login</a></p>
  </div>

  <script src="script.js" type="text/javascript"></script>
  
</body>
</html>
